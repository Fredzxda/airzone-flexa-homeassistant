# À intégrer sous la clé `modbus:` dans configuration.yaml ; ne pas créer deux clés modbus.
- name: airzone_flexa
  type: tcp
  host: 192.168.1.100  # À remplacer par l'adresse IP locale de VOTRE passerelle EW41
  port: 502
  delay: 1
  timeout: 3

  climates:
  # --- ZONE 1 ---
  - name: "Clim Zone 1"
    address: 266
    target_temp_register: 259
    slave: 1
    scan_interval: 30
    data_type: int16
    scale: 0.1
    precision: 1
#        hvac_onoff_register: 256

  - name: "Clim Zone 2"
    address: 522
    target_temp_register: 515
    slave: 1
    scan_interval: 30
    data_type: int16
    scale: 0.1
    precision: 1
#        hvac_onoff_register: 512

  - name: "Clim Zone 3"
    address: 778
    target_temp_register: 771
    slave: 1
    scan_interval: 30
    data_type: int16
    scale: 0.1
    precision: 1
        # Pas de hvac_onoff_register : registre 768 = bitfield

  - name: "Clim Zone 4"
    address: 1034
    target_temp_register: 1027
    slave: 1
    scan_interval: 30
    data_type: int16
    scale: 0.1
    precision: 1
        # Pas de hvac_onoff_register : 1024 est un bitfield

  sensors:
  - name: "Airzone Mode Global"
    address: 0
    slave: 1
    scan_interval: 30
    data_type: int16

  - name: "AZ Diagnostic Reg 1"
    address: 1
    slave: 1
    input_type: holding
    data_type: int16
    scan_interval: 60

  - name: "AZ Diagnostic Reg 2"
    address: 2
    slave: 1
    input_type: holding
    data_type: int16
    scan_interval: 60

  - name: "AZ Diagnostic Reg 3"
